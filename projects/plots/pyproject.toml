[project]
name = "plots"
version = "0.0.1"
description = "Aframe performance summary plots"
authors = [{ name = "Alec Gunny" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "bokeh~=3.0",
    "numpy>=2",
    "scipy>=1.9",
    "h5py>=3.10,<4",
    "gwpy~=3.0.8",
    "astropy>=6.0",
    "gwosc",
    "tqdm~=4.66",
    "ledger",
    "priors",
    "utils",
    "python-ligo-lw>=1.8.3,<2",
    "jsonargparse>=4.27.4,<5",
]

# Make the vizapp dependencies fully optional.
[project.optional-dependencies]
vizapp = [
    "torch",
    "utils[torch]",
    "matplotlib>=3.9.4",
    "pillow>=11",
    "omegaconf~=2.2",
]
# Same as `vizapp`, but with the CUDA torch build, for running the app with
# `device: cuda`.
vizapp-cuda = [
    "torch",
    "utils[torch]",
    "matplotlib>=3.9.4",
    "pillow>=11",
    "omegaconf~=2.2",
]

[project.scripts]
sensitive-volume = "plots.cli:main"
vizapp = "plots.vizapp.main:cli"

[dependency-groups]
test = ["pytest>=8.3.0,<9"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[tool.uv]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "vizapp" }]
ledger = { workspace = true }
priors = { workspace = true }
utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
