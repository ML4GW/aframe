[project]
name = "plots"
version = "0.0.1"
description = "Aframe performance summary plots"
authors = [{ name = "Alec Gunny" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "bokeh~=3.0",
    "numpy>=2",
    "scipy>=1.9",
    "h5py>=3.10,<4",
    "gwpy>=4.0,<5",
    "astropy>=6.0",
    "gwosc",
    "tqdm~=4.66",
    "ledger",
    "priors",
    "utils",
    # Never imported directly. `DataQualityDict.from_veto_definer_file` reads
    # the LIGO_LW XML veto definer in plots/vetos/, which gwpy 4 does through
    # igwn-ligolw (the rename of python-ligo-lw). igwn-ligolw's lsctables
    # imports `lal` without declaring it, so lalsuite has to come along too.
    "igwn-ligolw>=2.1,<3",
    "lalsuite",
    "jsonargparse[signatures]>=4.29,<5",
]

# Make the vizapp dependencies fully optional.
[project.optional-dependencies]
# torchaudio comes in through ml4gw, but is listed so that it can be pinned to
# the same index as torch below
vizapp = [
    "torch",
    "torchaudio",
    "utils[torch]",
    "matplotlib>=3.9.4",
    "pillow>=11",
    "omegaconf~=2.2",
]
# Same as `vizapp`, but with the CUDA torch build, for running the app with
# `device: cuda`.
vizapp-cuda = [
    "torch",
    "torchaudio",
    "utils[torch]",
    "matplotlib>=3.9.4",
    "pillow>=11",
    "omegaconf~=2.2",
]

[project.scripts]
sensitive-volume = "plots.cli:main"
vizapp = "plots.vizapp.main:cli"

[dependency-groups]
test = ["pytest>=8.3.0,<9"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[tool.uv]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "vizapp" }]
torchaudio = [{ index = "pytorch-cpu", extra = "vizapp" }]
ledger = { workspace = true }
priors = { workspace = true }
utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
