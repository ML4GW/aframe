[project]
name = "online"
version = "0.0.1"
description = "Deploy aframe models over live data"
authors = [
    { name = "Will Benoit", email = "benoi090@umn.edu" },
    { name = "Alec Gunny", email = "alecg@mit.edu" },
    { name = "Ethan Marx", email = "emarx@mit.edu" },
]
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "utils[torch]",
    "ledger",
    "p_astro",
    "architectures",
    "arrakis>=0.2.0,<0.3",
    "amplfi",
    "ml4gw>=0.7.4",
    "torch==2.10.0",
    "omegaconf>=2.3.0,<3",
    "numpy>=2",
    "scipy>=1.9",
    "pandas>=2",
    "h5py>=3.10,<4",
    "astropy>=6.0",
    "bilby>=2.2.2,<3",
    "lalsuite",
    "matplotlib>=3.9.4",
    "ligo-skymap>=2.4.0,<3",
    "ligo-gracedb[kafka]>=2.15.4",
    "tables>=3.9",
    "gwpy>=3.0.12",
    "jsonargparse>=4.18.0",
    "psutil>=5.9",
    "pytz",
    "certifi",
    "pyyaml",
]

[project.scripts]
online = "online.cli:cli"
monitor = "online.monitor.cli:cli"

[dependency-groups]
test = ["pytest>=8.2.1,<9"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[tool.uv]

[tool.uv.sources]
utils = { workspace = true }
ledger = { workspace = true }
p_astro = { workspace = true }
architectures = { workspace = true }
# TODO: point at released version once available
amplfi = { git = "https://github.com/wbenoit26/amplfi", branch = "dev" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
