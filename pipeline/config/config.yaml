# =============================================================================
# Aframe pipeline configuration
# =============================================================================
# Copy this file and adjust it for your run, then pass it to snakemake:
#
#     snakemake --configfile my_run.yaml --profile pipeline/profiles/ldg
# =============================================================================

# --- Output directories ------------------------------------------------------
# REQUIRED: experiment-specific outputs (train/, export/, infer/, plots/) are
# written here. There is no default, so set this in your run config.
run_dir: /path/to/run

# Background strain data directory, containing train/ and test/
# subdirectories of fetched HDF5 files. Defaults to {run_dir}/data if
# omitted. Can be shared across experiments that cover the same GPS range,
# channels, and sample rate to avoid re-downloading data.
# background_dir: /path/to/shared/background

# Waveform data directory for training, validation, and testing waveforms.
# Defaults to {run_dir}/waveforms if omitted. Kept separate from
# background_dir so background and waveforms can point at different storage. 
# Can be shared across experiments with identical waveform parameters.
# waveforms_dir: /path/to/shared/waveforms

# --- Interferometers ---------------------------------------------------------
ifos:
  - H1
  - L1

# Data channels. Use bare IFO names (H1, L1, V1) for open data, or
# full channel names (H1:GDS-CALIB_STRAIN) for NDS2 access.
channels:
  - H1
  - L1

# --- GPS time ranges ---------------------------------------------------------
train_start: 1240579783
train_end: 1241443783
test_start: 1241443783
test_end: 1244035783

# --- Segment query -----------------------------------------------------------
# Data-quality flags to AND together for valid-data segments. 
# Use {ifo}_DATA for open data flags.
flags:
  - H1_DATA
  - L1_DATA

train_min_duration: 1024.0  # minimum train segment length (seconds)
test_min_duration: 128.0    # minimum test segment length (seconds)
max_duration: 20000.0       # maximum chunk length when splitting segments
sample_rate: 2048.0         # Hz

# --- Waveform generation -----------------------------------------------------
prior: &prior priors.priors.end_o3_ratesandpops  # module path to a prior
minimum_frequency: 20.0                          # Hz
reference_frequency: 50.0                        # Hz
waveform_duration: 8.0                           # seconds
waveform_approximant: IMRPhenomPv2
right_pad: 2.0                                   # seconds
seed: 1122

# --- Training waveforms ------------------------------------------------------
num_training_signals: 100000
# Pre-generate training waveforms to disk instead of sampling them
# on the fly during training.
pregenerate_training_waveforms: true
# Number of condor jobs that training waveforms are split across when
# pregenerate_training_waveforms is true.
num_train_waveform_jobs: 100

# --- Testing / validation waveforms ------------------------------------------
num_testing_signals: 500000
num_validation_signals: 20000

shifts:
  - 0.0  # seconds to shift H1 each time shift
  - 1.0  # seconds to shift L1 each time shift

spacing: 16.0           # spacing between testing injections (seconds)
buffer: 16.0            # edge buffer around each segment (seconds)
highpass: 32.0          # Hz
lowpass: null           # Hz; null to skip lowpass filtering
snr_threshold: 4.0      # minimum network SNR for rejection sampling
max_num_samples: 3000   # max waveforms generated per rejection-sampling batch

# Number of condor jobs that validation waveforms are split across
num_validation_jobs: 200

# --- Slurm -------------------------------------------------------------------
# GPU partition for training.
train_partition: gpuA40x4

# Number of GPUs to request for training. Must match trainer.devices in
# your train.yaml.
train_num_gpus: 1

# GPU partition for export and inference.
inference_partition: gpuA40x4

# --- Training ----------------------------------------------------------------
# Lightning CLI YAML config for `train fit`.
train_config: projects/train/train.yaml

# Submit training to Nautilus via train-remote instead of
# running it locally. Requires the data to be mirrored to
# S3 and AWS_* credentials plus WANDB_API_KEY in the environment.
# Not functional yet.
remote_train: false
# remote_run_dir: s3://aframe/runs/my-run
# remote_background_dir: s3://aframe/data/train
# remote_waveforms_dir: s3://aframe/data/waveforms/train

# --- Export & inference ------------------------------------------------------
# Analysis type:
#   - hdf5: timeslide background segments + injection set
#   - rnp: Rates and Populations frames.
analysis_type: hdf5
# rnp_frame_dir: /path/to/rnp/frames   # required when analysis_type: rnp
# rnp_channel: <channel>               # channel within the frames

# Inference mode:
#   - triton: Triton server on GPU + streaming CPU clients
#   - inprocess: self-contained GPU jobs, model loaded locally per job
inference_mode: triton

# Model backend for in-process inference::
#   - export: model_exported.pt2 run as a GraphModule. Portable across GPU archs.
#   - aoti: Ahead-of-Time Inductor compilation. Compiles once, but GPU-arch specific
#           and needs CUDA toolkit. Good for Delta which has a homogeneous GPU pool
#           and where slurm can specify the GPU partition.
#   - compile: model_exported.pt2 + torch.compile per-job. Useful for long jobs
#              on clusters with heterogeneous GPU pools like OSG.
inference_backend: export

# Number of (file, shift) branches each job processes
branches_per_job: 1

# Preprocessor class compiled into the served model. Its init_args are
# supplied from the shared parameters below by export.smk.
export_preprocessor: utils.preprocessing.BatchWhitener

# Whitening / windowing
psd_length: 64.0                 # seconds of PSD data
kernel_length: 1.5               # model input window (seconds)
fduration: 1.0                   # whitening filter duration (seconds)
fftlength: null                  # PSD FFT length (s). null -> kernel_length + fduration
inference_sampling_rate: 4.0     # Hz
inference_batch_size: 128        # inference windows per request

# Inference postprocessing and livetime.
integration_window_length: 1.5   # seconds
cluster_window_length: 8.0       # seconds
Tb: 31536000.0                   # target background livetime (seconds)
zero_lag: false                  # also analyze unshifted (zero-lag) data

# Triton server.
model_name: aframe-stream
model_version: -1
triton_image: /home/william.benoit/images/aframe/tritonserver_26.05.sif
# Comma-separated GPU IDs for export and inference server only.
# Pin training GPUs via trainer.devices in the train_config.
gpus: "0"

# Snapshotter instances hosted per GPU. Baked into the model at export time
# and used to size the concurrent-inference pool (streams_per_gpu * num_gpus)
# and the per-branch request rate.
streams_per_gpu: 6

# Server self-stops if it receives no inference for this many seconds, so an
# interrupted/crashed run doesn't leave Triton lingering on the GPU. Must
# exceed the longest expected gap between requests (e.g. condor scheduling
# between inference branches). Set to 0 to disable.
triton_idle_timeout: 1200

# Average inference-request rate per GPU (Hz); null to disable throttling.
# The per-branch rate is 2 * rate_per_gpu / streams_per_gpu, so the
# aggregate server load is held at rate_per_gpu * num_gpus.
rate_per_gpu: 70.0

# --- Plots -------------------------------------------------------------------
mass_combos:
  - [35, 35]
  - [35, 20]
  - [20, 20]
  - [20, 10]

source_prior: *prior
dt: null  # recovery time delta in seconds (null to disable)
