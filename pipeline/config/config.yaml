# =============================================================================
# Aframe pipeline configuration
# =============================================================================
# Copy this file and adjust it for your run, then pass it to snakemake:
#
#     snakemake --configfile my_run.yaml --profile pipeline/profiles/condor
# =============================================================================

# --- Output directories ------------------------------------------------------
# Experiment-specific outputs (train/, export/, infer/, plots/) are
# written here.
run_dir: /path/to/run

# Background strain data directory, containing train/ and test/
# subdirectories of fetched HDF5 files. Defaults to {run_dir}/data if
# omitted. Can be shared across experiments that cover the same GPS range,
# channels, and sample rate to avoid re-downloading data.
background_dir: /path/to/shared/background

# Waveform data directory for training, validation, and testing waveforms.
# Defaults to {background_dir}/waveforms if omitted. Can be shared across
# experiments with identical waveform parameters.
waveforms_dir: /path/to/shared/waveforms

# --- Interferometers ---------------------------------------------------------
ifos:
  - H1
  - L1

# Data channels. Use bare IFO names (H1, L1, V1) for open data, or
# full channel names (H1:GDS-CALIB_STRAIN) for NDS2 access.
channels:
  - H1
  - L1

# --- GPS time ranges ---------------------------------------------------------
train_start: 1240579783
train_end: 1241443783
test_start: 1241443783
test_end: 1244035783

# --- Segment query -----------------------------------------------------------
# Data-quality flags to AND together for valid-data segments. 
# Use {ifo}_DATA for open data flags.
flags:
  - H1_DATA
  - L1_DATA

train_min_duration: 1024.0  # minimum train segment length (seconds)
test_min_duration: 128.0    # minimum test segment length (seconds)
max_duration: 20000.0       # maximum chunk length when splitting segments
sample_rate: 2048.0         # Hz

# --- Waveform generation -----------------------------------------------------
prior: &prior priors.priors.end_o3_ratesandpops  # module path to a prior
minimum_frequency: 20.0                          # Hz
reference_frequency: 50.0                        # Hz
waveform_duration: 8.0                           # seconds
waveform_approximant: IMRPhenomPv2
right_pad: 2.0                                   # seconds
seed: 1122

# --- Training waveforms ------------------------------------------------------
num_training_signals: 100000
# Pre-generate training waveforms to disk instead of sampling them
# on the fly during training.
pregenerate_training_waveforms: true

# --- Testing / validation waveforms ------------------------------------------
num_testing_signals: 500000
num_validation_signals: 20000

shifts:
  - 0.0  # seconds to shift H1 each time shift
  - 1.0  # seconds to shift L1 each time shift

spacing: 16.0           # spacing between testing injections (seconds)
buffer: 16.0            # edge buffer around each segment (seconds)
highpass: 32.0          # Hz
lowpass: null           # Hz; null to skip lowpass filtering
snr_threshold: 4.0      # minimum network SNR for rejection sampling
max_num_samples: 3000   # max waveforms generated per rejection-sampling batch

# --- Training ----------------------------------------------------------------
# Lightning CLI YAML config for `train fit`
train_config: projects/train/configs/bbh.yaml

# --- Export ------------------------------------------------------------------
# Export CLI YAML config
export_config: projects/export/export.yaml

# --- Inference ---------------------------------------------------------------
# These must match the values used at export time in export_config.
psd_length: 64.0                 # seconds of PSD data
fduration: 1.0                   # whitening filter duration (seconds)
inference_sampling_rate: 4.0     # Hz
inference_batch_size: 128        # inference windows per request
integration_window_length: 1.5   # seconds
cluster_window_length: 8.0       # seconds
Tb: 31536000.0                   # target background livetime (seconds)
zero_lag: false                  # also analyze unshifted (zero-lag) data

# Triton server settings
model_name: aframe-stream
model_version: -1
triton_image: hermes/tritonserver:23.01
gpus: "0"  # comma-separated GPU IDs for the Triton server

# Average inference-request rate per GPU (Hz), null to disable.
rate_per_gpu: 70.0

# --- Plots -------------------------------------------------------------------
mass_combos:
  - [35, 35]
  - [35, 20]
  - [20, 20]
  - [20, 10]

source_prior: *prior
dt: null  # recovery time delta in seconds (null to disable)
