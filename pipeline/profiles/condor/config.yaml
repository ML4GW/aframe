# Snakemake HTCondor execution profile.
#
#     snakemake --profile pipeline/profiles/condor
#
# Requirements on the submit node:
#   - The aframe-smk conda environment (pipeline/envs/snakemake.yaml),
#     which provides snakemake and snakemake-executor-plugin-htcondor.
#   - A valid LIGO SciToken (htgettoken -a vault.ligo.org)
#   - LIGO_GROUP and LIGO_USERNAME set for accounting
#   - AFRAME_CONTAINER_ROOT pointing at the built .sif images
#   - AFRAME_DATA_DIRS: comma-separated directories to bind into
#     containers (run_dir, background_dir, waveforms_dir parents)
#

executor: htcondor

# Maximum number of simultaneously submitted jobs. (placeholder)
jobs: 500

# Wait for output files to appear on the shared filesystem after a job
# completes (placeholder)
latency-wait: 60

# Resubmit failed jobs and time out held jobs. (placeholders)
retries: 2
htcondor-held-timeout: 600

rerun-incomplete: true
keep-going: false

software-deployment-method: apptainer

# $AFRAME_DATA_DIRS binds the run/data/waveform dirs into the container.
# Setting $AFRAME_DEV to any non-empty value binds the $PWD to /opt/aframe.
# Because snakemake should be run from the repo's root directory, this
# is the equivalent of the --dev flag for law.
# $HOME is passed explicitly to prevent condor from rebinding it to the
# working directory, which causes cache files to be written to te repo.
apptainer-args: >-
  "--nv"
  "--bind $AFRAME_DATA_DIRS" 
  "${AFRAME_DEV:+--bind $PWD:/opt/aframe}" 
  "--env HOME=$HOME"

default-resources:
  # Forward environment variables from the submit node.
  getenv: LIGO_*, AWS_*, AFRAME_*, WANDB_*, PATH, HOME, USER, BEARER_TOKEN_FILE, KRB5*

  # Pass through authentication and account info as raw job ad attributes
  # using the classad_ prefix. The plugin supports passing attributes
  # via the htcondor_submit_ prefix, but it wraps string values in
  # double-quotes which breaks submit commands.
  classad_OAuthServicesNeeded: scitokens
  classad_AcctGroup: $ENV(LIGO_GROUP)
  classad_AcctGroupUser: $ENV(LIGO_USERNAME)

  # Static defaults, can be overridden per rule.
  request_memory: 8GB
  request_disk: 1GB

# Per-rule memory based on observed values
set-resources:
  generate_train_segments:
    request_memory: 512MB
  generate_test_segments:
    request_memory: 512MB
  fetch_train_background:
    request_memory: 2GB
  fetch_test_background:
    request_memory: 2GB
  testing_waveforms_branch:
    request_memory: 5GB
  validation_waveforms_branch:
    request_memory: 2GB
  aggregate_testing_waveforms:
    request_memory: 1GB
  aggregate_validation_waveforms:
    request_memory: 1GB
  training_waveforms:
    request_memory: 64GB

# `fetch` downloads with nproc=3, so give the fetch rules a few cores.
set-threads:
  fetch_train_background: 4
  fetch_test_background: 4
