name: snakemake dry-run

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "Snakefile"
      - "**/*.smk"
      - "pipeline/**"
      - "scripts/code_snapshot.py"
  push:
    branches:
      - main
      - dev

jobs:
  dry-run:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version in pipeline/envs/snakemake.conda-lock.yml and the images
      - name: install snakemake
        run: pip install "snakemake==9.27.0"

      # As run.sh does: copy the repo into a run directory and run from there
      - name: validate the pipeline DAG
        run: |
          mkdir /tmp/aframe-ci-run
          cd /tmp/aframe-ci-run
          python "$GITHUB_WORKSPACE/scripts/code_snapshot.py"
          snakemake -n --cores 2 --snakefile code/Snakefile \
            --configfiles code/pipeline/config/config.yaml
