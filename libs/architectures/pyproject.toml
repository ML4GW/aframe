[project]
name = "architectures"
version = "0.1.0"
description = "Aframe neural network architectures"
authors = [{ name = "Ethan Jacob Marx", email = "ethan.marx@ligo.org" }]
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "einops>=0.8,<0.9",
    "jaxtyping>=0.2",
    "ml4gw>=0.8.4",
    "h5py>=3.10,<4",
    "numpy>=2",
    "torch",
]

[dependency-groups]
test = ["pytest>=8.2.1,<9"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
