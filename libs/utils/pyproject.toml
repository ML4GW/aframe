[project]
name = "utils"
version = "0.1.0"
description = "General utility functions for Aframe"
authors = [{ name = "Ethan Jacob Marx", email = "ethan.marx@ligo.org" }]
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2",
    "s3fs>=2024,<2025",
    "astropy>=6.0.1",
    "scipy>=1.9",
]

# `utils.preprocessing` and `utils.augmentation` define torch Modules.
# Projects/libs that only need `utils.logging`/`cosmology`/`s3`/`data`
# (e.g. `data`, `ledger`, `priors`, `p_astro`) should depend on bare `utils`
# and avoid pulling in torch and the CUDA stack.
[project.optional-dependencies]
torch = [
    "torch",
    "ml4gw>=0.8.0",
    "h5py>=3.10,<4",
]

[dependency-groups]
test = ["pytest>=8.3.0,<9", "torch", "ml4gw>=0.8.0", "h5py>=3.10,<4"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
