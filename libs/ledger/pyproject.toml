[project]
name = "ledger"
version = "0.1.0"
description = "Objects for storing and manipulating aframe data"
authors = [{ name = "Ethan Marx", email = "emarx@mit.edu" }]
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "astropy>=6.0",
    "h5py>=3.10.0,<4",
    "igwn-segments>=2.1,<3",
    "numpy>=2",
    "tqdm>=4.66",
    "utils",
]

[project.optional-dependencies]
generation = [
    "pycbc>=2.5.1,<3",
    "lalsuite",
]

[dependency-groups]
test = ["pytest>=8.2.0,<9", "pycbc>=2.5.1,<3", "lalsuite"]
dev = [{ include-group = "test" }, "jupyter>=1.0.0,<2"]

[tool.uv]

[tool.uv.sources]
utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
