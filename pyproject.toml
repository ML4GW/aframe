[project]
name = "aframe"
version = "0.0.1"
description = "End-to-end aframe pipeline components"
authors = [
    { name = "Ethan Marx", email = "emarx@mit.edu" },
    { name = "William Benoit", email = "benoi090@umn.edu" },
    { name = "Alec Gunny", email = "alec.gunny@ligo.org" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "spython>=0.3",
    "jsonargparse>=4.27.1,<5",
]

[project.scripts]
build-containers = "scripts.build_containers:main"
aframe-init = "scripts.aframe_init:main"

[dependency-groups]
dev = [
    "conda-lock>=4",
    "prek>=0.1",
]
docs = [
    "Sphinx>5.0",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=2.0.0,<3",
    "sphinx-autodoc-typehints>=2.0.0,<3",
    "linkify-it-py>=2.0.3,<3",
    "sphinx-tabs>=3.4.7,<4",
    "jupyter>=1.0.0,<2",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]
override-dependencies = [
    "geventhttpclient>=2.3.3"
]

required-version = ">=0.9.30"

# Pin torchaudio to 2.10.0 because 2.11.0 is built for CUDA 13, which
# is incompatible with Volta-series GPUs.
constraint-dependencies = ["torchaudio==2.10.0"]

# The `data` and `plots` projects declare `cpu` and `cuda` extras so that we
# can define them as conflicting here. This forces `uv` to resolve both torch
# twice, once for each path. Not doing so would either add extra, heavy
# dependencies to the `data` and `plots` containers, or would preclude those
# projects from being a part of this workspace.
#
# The `data` project is always CPU, but the `cuda` group exists so that this
# split can happen. The `plots` project has an actual CUDA variant so that
# the vizapp can run the model on GPU if desired.
#
# Note that `uv sync --all-extras` cannot work with conflicting extras.
conflicts = [
    [{ package = "data", extra = "cpu" }, { package = "data", extra = "cuda" }],
    [
        { package = "plots", extra = "vizapp" },
        { package = "plots", extra = "vizapp-cuda" },
    ],
]

[tool.uv.workspace]
members = ["libs/*", "projects/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 79
extend-include = ["T201"]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-safe-fixes = ["C408"]
mccabe = {"max-complexity" = 18}
select = ["B", "C", "E", "F", "W", "I", "UP", "B9"]
# ignore W605 and E203 for consistency with black
# ignore F722 for compatibility with jaxtyping
ignore = ["W605", "E203", "F722"]

# ignore asterisk imports and unused
# import errors in __init__ files
per-file-ignores =  {"**/__init__.py" = ["F401", "F403"]}
